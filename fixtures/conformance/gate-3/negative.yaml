      reason_codes: [EVALUATION_NOT_ACCEPTANCE]
    covers:
      operations: [Evaluation]
      invariants: [2, 10]
      relationships: []
      conformance_dimensions: {semantic: failed}

  - fixture_id: NEG-006
    title: Policy rewrites failed evidence to satisfied
    given:
      evidence_record: {id: fixture.evidence.failed-test, result: failed}
      policy_decision: allowed-with-exception
    when: mutate the evidence result to satisfied
    expected:
      verdict: FAIL
      outcome: evidence-mutation-prohibited
      reason_codes: [POLICY_MUST_NOT_MODIFY_EVIDENCE, HISTORY_IMMUTABLE]
    covers:
      operations: [Resolution]
      invariants: [1, 10]
      relationships: []
      conformance_dimensions: {behavioral: failed}

  - fixture_id: NEG-007
    title: Required capability has no conformant binding
    given:
      requirement: fixture.requirement.evidence
      strength: required
      bindings: []
    when: report composition ready
    expected:
      verdict: FAIL
      outcome: unresolved-required-capability
      reason_codes: [REQUIRED_BINDING_MISSING]
    covers:
      operations: [Declaration, Resolution]
      invariants: [5]
      relationships: []
      conformance_dimensions: {semantic: failed}

  - fixture_id: NEG-008
    title: Current lifecycle state lacks transition history
    given:
      current_state: active
      transition_records: []
    when: claim replayable lifecycle conformance
    expected:
      verdict: FAIL
      outcome: history-missing
