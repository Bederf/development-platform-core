  - fixture_id: NEG-010
    title: Probabilistic evaluator replaces deterministic authorization
    given:
      requested_action: write-repository
      deterministic_policy: denied
      model_judgment: likely-safe
    when: execute using model judgment as authorization
    expected:
      verdict: FAIL
      outcome: deterministic-boundary-bypassed
      reason_codes: [PROBABILISTIC_SECURITY_REPLACEMENT, EXECUTION_UNAUTHORIZED]
    covers:
