    covers:
      operations: [Declaration]
      invariants: [13]
      relationships: []
      conformance_dimensions: {semantic: failed}

  - fixture_id: NEG-013
    title: All conformance dimensions fail for independent reasons
    given:
      implementation: fixture.impl.invalid
      structural_issue: required capability identity missing
      semantic_issue: declared responsibility contradicts base capability
      behavioral_issue: fake execution returns success on denied action
      operational_issue: required service is unavailable and evidence expired
    when: evaluate multidimensional conformance
    expected:
      verdict: FAIL
      outcome: nonconformant
      reason_codes: [STRUCTURAL_FAILURE, SEMANTIC_FAILURE, BEHAVIORAL_FAILURE, OPERATIONAL_FAILURE]
    covers:
      operations: [Evaluation]
      invariants: [4, 7, 9, 10]
      relationships: [CONFORMS_TO]
      conformance_dimensions:
        structural: failed
        semantic: failed
        behavioral: failed
        operational: failed
