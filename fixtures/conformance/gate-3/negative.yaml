fixture_format: pre-schema-semantic-fixture.v1
category: negative
fixtures:
  - fixture_id: NEG-001
    title: Declaration is treated as authority
    given:
      declaration: fixture.requirement.deploy
      issuer: fixture.actor.unrecognized
      authority_binding: null
    when: treat publication as authorization
    expected:
      verdict: FAIL
      outcome: authority-missing
      reason_codes: [DECLARATION_NOT_AUTHORITY]
    covers:
      operations: [Declaration]
      invariants: []
      relationships: []
      conformance_dimensions: {semantic: failed}

  - fixture_id: NEG-002
    title: Observation is promoted directly to truth and evidence
    given:
      observation: fixture.observation.provider-success
      evidence_admission: null
      evaluation: null
    when: assert the observed subject is true and accepted
    expected:
      verdict: FAIL
      outcome: observation-boundary-violated
      reason_codes: [OBSERVATION_NOT_TRUTH, OBSERVATION_NOT_EVIDENCE]
    covers:
      operations: [Observation]
      invariants: [3, 10]
      relationships: []
      conformance_dimensions: {semantic: failed}

  - fixture_id: NEG-003
    title: Resolution is treated as permission
    given:
      selection_result: fixture.selection.impl-alpha
      policy_decision: null
    when: create an active binding
    expected:
      verdict: FAIL
      outcome: permission-missing
      reason_codes: [RESOLUTION_NOT_PERMISSION]
    covers:
      operations: [Resolution]
      invariants: [4, 10]
      relationships: []
      conformance_dimensions: {semantic: failed}

  - fixture_id: NEG-004
    title: Completed execution is treated as successful outcome
    given:
      execution_result: {status: completed, artifacts: [fixture.artifact.binary]}
      evaluation_result: null
    when: mark acceptance criteria satisfied
    expected:
      verdict: FAIL
      outcome: success-unproven
      reason_codes: [EXECUTION_NOT_SUCCESS]
    covers:
      operations: [Execution]
      invariants: [10]
      relationships: []
      conformance_dimensions: {behavioral: failed}

  - fixture_id: NEG-005
    title: Satisfied evaluation is treated as release acceptance
    given:
